name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changes in resume pipeline
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            resume:
              - 'resume/**'

      - name: Check committed CVs
        id: cvs
        run: |
          if compgen -G "public/cv/*.pdf" > /dev/null; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.filter.outputs.resume == 'true' || steps.cvs.outputs.missing == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache Hugging Face models
        if: steps.filter.outputs.resume == 'true' || steps.cvs.outputs.missing == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-mbart-${{ runner.os }}
          restore-keys: hf-mbart-

      - name: Install Python dependencies
        if: steps.filter.outputs.resume == 'true' || steps.cvs.outputs.missing == 'true'
        run: |
          pip install --upgrade pip
          pip install transformers torch sentencepiece sacremoses jinja2 python-frontmatter pyyaml playwright protobuf tiktoken

      - name: Install Playwright Chromium
        if: steps.filter.outputs.resume == 'true' || steps.cvs.outputs.missing == 'true'
        run: playwright install --with-deps chromium

      - name: Generate resume PDFs
        if: steps.filter.outputs.resume == 'true' || steps.cvs.outputs.missing == 'true'
        run: python resume/build.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Worker typecheck
        working-directory: worker
        run: npm ci && npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: |
          # Valores PUBLICOS (anon/publishable + URLs) — seguros de versionar.
          # Vite 7 NAO inlineia process.env; gera o .env.production que o build le.
          cat > .env.production <<'EOF'
          VITE_SUPABASE_URL=https://ohtkfjckydmjsfuouyaj.supabase.co
          VITE_SUPABASE_ANON_KEY=sb_publishable_YrJ0_kAcZGUWOrvHtsKebw_lxjJkMnu
          VITE_UMAMI_WEBSITE_ID=${{ secrets.VITE_UMAMI_WEBSITE_ID }}
          VITE_UMAMI_SRC=${{ secrets.VITE_UMAMI_SRC }}
          VITE_WORKER_URL=https://portfolio-cavalcante-worker.cavalcanteprofissional.workers.dev
          EOF
          npm run build

      - name: Check HF_TOKEN (publicado no site)
        if: github.ref == 'refs/heads/main'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install -q huggingface_hub
          python - <<'PY'
          import os

          token = os.environ.get("HF_TOKEN") or ""
          if not token:
              out = "HF_TOKEN: AUSENTE (secret vazio/variable)"
              ok = False
          else:
              from huggingface_hub import HfApi
              try:
                  me = HfApi().whoami(token=token)
                  name = me.get("name") or me.get("orgname") or me.get("username") or "?"
                  out = f"HF_TOKEN: OK (user/org '{name}') len={len(token)}"
                  ok = True
              except Exception as e:
                  out = f"HF_TOKEN: INVALIDO ({str(e)[:160]}) len={len(token)}"
                  ok = False
          print(out)
          os.makedirs("dist", exist_ok=True)
          with open("dist/hf-status.txt", "w", encoding="utf-8") as f:
              f.write(out + "\nok=" + str(ok) + "\n")
          PY

      - name: Deploy Cloudflare Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Secrets CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID ausentes — deploy do Worker pulado"
            exit 0
          fi
          npm ci
          npx wrangler deploy

      - name: Sync Worker secrets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SERVICE_ROLE_KEY: ${{ secrets.SERVICE_ROLE_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          UMAMI_API_KEY: ${{ secrets.UMAMI_API_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Secrets Cloudflare ausentes — sync de secrets pulado"
            exit 0
          fi
          put() {
            local name="$1" value="$2"
            if [ -n "${value}" ]; then
              printf '%s' "${value}" | npx wrangler secret put "${name}"
            else
              echo "::notice::Secret '$name' ausente no GitHub — valor atual preservado"
            fi
          }
          # O DEPLOY sobe o CODIGO; o wrangler deploy NUNCA carrega secrets.
          # Este passo garante que o Worker de producao tenha as chaves.
          put GROQ_API_KEY "$GROQ_API_KEY"
          put SERVICE_ROLE_KEY "$SERVICE_ROLE_KEY"
          put BREVO_API_KEY "$BREVO_API_KEY"
          put UMAMI_API_KEY "$UMAMI_API_KEY"

      - name: Authenticate to Google Cloud (Umami Cloud Run)
        # O contexto `secrets` NAO e valido em `if:` de step (o GitHub rejeita o
        # workflow inteiro). O guard usa `steps.<id>.outcome`: sem credencial a
        # auth falha, os steps abaixo sao pulados e o Pages continua publicando.
        id: gcp-auth
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI (Umami Cloud Run)
        id: gcloud-setup
        if: github.ref == 'refs/heads/main' && steps.gcp-auth.outcome == 'success'
        continue-on-error: true
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Umami Cloud Run
        # Umami é self-host gratuito (MIT) no GCP Cloud Run + Postgres do Supabase.
        # A key de API dele NÃO é paga: é gerada no painel do próprio instance depois
        # deste deploy (Settings -> API Keys) e vira o secret UMAMI_API_KEY do Worker.
        # continue-on-error: falha do GCP nao pode derrubar o deploy do Pages.
        if: github.ref == 'refs/heads/main' && steps.gcp-auth.outcome == 'success' && steps.gcloud-setup.outcome == 'success'
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          GCP_REGION: ${{ secrets.GCP_REGION }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$APP_SECRET" ] || [ -z "$GCP_PROJECT" ] || [ -z "$GCP_REGION" ]; then
            echo "::notice::Secrets GCP (PROJECT/REGION) e/ou DATABASE_URL/APP_SECRET ausentes — deploy do Umami Cloud Run pulado"
            exit 0
          fi
          # DATABASE_URL = Supabase session pooler (porta 5432) — suporta a migracao
          # que o Umami roda no boot; se der erro de SSL, acrescente ?sslmode=require
          gcloud run deploy umami \
            --project "$GCP_PROJECT" \
            --region "$GCP_REGION" \
            --image ghcr.io/umami-software/umami:postgresql-latest \
            --platform managed \
            --allow-unauthenticated \
            --port 3000 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 2 \
            --concurrency 80 \
            --set-env-vars "DATABASE_TYPE=postgresql,DISABLE_TELEMETRY=1,TRACKER_SCRIPT_NAME=track.js,DATABASE_URL=${DATABASE_URL},APP_SECRET=${APP_SECRET}" \
            --quiet

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
